apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.1

  dataDirHostPath: /var/lib/rook

  mon:
    count: 3
    allowMultiplePerNode: false

  mgr:
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: rook
        enabled: true

  dashboard:
    enabled: true

  storage:
    useAllNodes: false
    useAllDevices: false

    nodes:
      - name: storage1
        devices:
          - name: nvme1n1
          - name: nvme2n1
          - name: nvme3n1

      - name: storage2
        devices:
          - name: nvme1n1
          - name: nvme2n1
          - name: nvme3n1

      - name: storage3
        devices:
          - name: nvme1n1
          - name: nvme2n1
          - name: nvme3n1
