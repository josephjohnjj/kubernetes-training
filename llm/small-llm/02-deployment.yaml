apiVersion: apps/v1
kind: Deployment
metadata:
  name: small-llm
  namespace: small-llm
  labels:
    app.kubernetes.io/name: small-llm
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: small-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: small-llm
        app.kubernetes.io/component: inference
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        worker-type: cpu
      containers:
        - name: ollama
          image: ollama/ollama:0.32.15@sha256:ab903927dcb081c6d3780b54a7b6de4fda6a65cb9799e4f047a34ba9511b9c78
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_KEEP_ALIVE
              value: 5m
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: /root/.ollama
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: small-llm-model-cache
