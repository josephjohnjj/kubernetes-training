apiVersion: batch/v1
kind: Job
metadata:
  name: small-llm-load-model
  namespace: small-llm
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: small-llm
        app.kubernetes.io/component: model-loader
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      nodeSelector:
        worker-type: cpu
      containers:
        - name: load-model
          image: curlimages/curl:8.15.0
          command:
            - sh
            - -ec
            - |
              until curl --fail --silent --show-error \
                http://small-llm:11434/api/tags >/dev/null; do
                sleep 5
              done

              curl --fail --show-error \
                --max-time 1700 \
                -H 'Content-Type: application/json' \
                -X POST \
                http://small-llm:11434/api/pull \
                -d '{"model":"qwen2.5:0.5b","stream":false}'
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
