---
- name: Reject the legacy SSH and kubeadm deployment path
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Explain the Talos replacement
      ansible.builtin.fail:
        msg: >-
          This playbook targets mutable SSH hosts and cannot be used with
          Talos. Use provisioning/talos/scripts/02-generate-config.sh followed by
          Terraform and 04-bootstrap.sh, then deploy Kubernetes resources through
          Argo CD.
