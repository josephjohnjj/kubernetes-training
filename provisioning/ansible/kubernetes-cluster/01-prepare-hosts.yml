---
# ---------------------------------------------------------
# Play 1: System Update + Base Preparation (Ubuntu 22.04)
# ---------------------------------------------------------
- name: Prepare all nodes safely
  hosts: all
  become: true
  gather_facts: true

  environment:
    DEBIAN_FRONTEND: noninteractive

  vars:
    required_system_packages:
      - acl
      - apt-transport-https
      - autoconf
      - automake
      - build-essential
      - ca-certificates
      - cmake
      - curl
      - dnsutils
      - g++
      - gcc
      - git
      - gpg
      - htop
      - libc6
      - libc6-dev
      - lsof
      - make
      - nano
      - ncat
      - net-tools
      - pciutils
      - perl
      - python3
      - python3-dev
      - python3-pip
      - tar
      - unzip
      - vim
      - wget
      - xauth

  module_defaults:
    ansible.builtin.apt:
      force_apt_get: true
      lock_timeout: 300

  tasks:
    - name: Set system hostname
      hostname:
        name: "{{ inventory_hostname }}"
      tags: hostname

    - name: Ensure hostname persists after reboot
      copy:
        dest: /etc/hostname
        content: "{{ inventory_hostname }}\n"
      tags: hostname

    - name: Get node primary IP
      set_fact:
        node_ip: "{{ ansible_default_ipv4.address }}"
      tags: hostname

    - name: Map hostname to IP in /etc/hosts
      lineinfile:
        path: /etc/hosts
        regexp: ".*{{ inventory_hostname }}$"
        line: "{{ node_ip }} {{ inventory_hostname }}"
        state: present
      tags: hostname

    - name: Wait for first-boot package configuration to finish
      ansible.builtin.wait_for:
        path: /var/lib/cloud/instance/boot-finished
        state: present
        timeout: 900
      tags: apt

    - name: Check package database before making changes
      ansible.builtin.command: dpkg --audit
      register: dpkg_audit_before
      changed_when: false
      failed_when: dpkg_audit_before.rc != 0 or dpkg_audit_before.stdout | trim | length > 0
      tags: apt

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        update_cache_retries: 5
        update_cache_retry_max_delay: 30
      tags: apt

    - name: Install required packages in one transaction
      ansible.builtin.apt:
        name: "{{ required_system_packages }}"
        state: present
      register: package_install
      retries: 3
      delay: 15
      until: package_install is succeeded
      tags:
        - apt
        - packages
        - core
        - devtools
        - build
        - deps
        - python

    - name: Install Kubernetes Python client dependencies
      ansible.builtin.pip:
        name:
          - kubernetes
          - openshift
          - pyyaml
        state: present
      tags:
        - deps
        - python
        - kubernetes
        - yamllint

    - name: Verify package database after installation
      ansible.builtin.command: dpkg --audit
      register: dpkg_audit_after
      changed_when: false
      failed_when: dpkg_audit_after.rc != 0 or dpkg_audit_after.stdout | trim | length > 0
      tags: apt

    # -----------------------------------------------------
    # Reboot
    # -----------------------------------------------------
    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot nodes if required
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami
      when: reboot_required.stat.exists
