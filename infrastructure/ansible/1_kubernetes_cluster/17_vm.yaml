---
- name: Configure vm.max_map_count for OpenSearch
  hosts: all
  become: true

  tasks:
    - name: Set vm.max_map_count immediately
      ansible.builtin.sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: true

    - name: Verify vm.max_map_count
      ansible.builtin.command: sysctl vm.max_map_count
      register: vm_max_map_count
      changed_when: false

    - name: Display current value
      ansible.builtin.debug:
        var: vm_max_map_count.stdout
