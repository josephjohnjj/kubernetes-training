---
- name: Install Jaeger using Helm
  hosts: control1
  become: true

  collections:
    - kubernetes.core

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  vars:
    jaeger_namespace: observability

  tasks:
    - name: Add Jaeger Helm repository
      kubernetes.core.helm_repository:
        name: jaegertracing
        repo_url: https://jaegertracing.github.io/helm-charts

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: helm repo update

    - name: Create observability namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ jaeger_namespace }}"

    - name: Install Jaeger using Helm chart
      kubernetes.core.helm:
        name: jaeger
        chart_ref: jaegertracing/jaeger
        release_namespace: "{{ jaeger_namespace }}"
        create_namespace: false
        state: present
        wait: true
