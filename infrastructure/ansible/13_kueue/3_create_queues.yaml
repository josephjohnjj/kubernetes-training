---
- name: Deploy Kueue queue resources
  hosts: control1
  become: true

  collections:
    - kubernetes.core

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  vars:
    manifest_src_dir: "./kueue_manifests"
    manifest_dest_dir: "/tmp/kueue_manifests"

    kueue_manifests:
      - cpu_queue.yaml
      - gpu_queue.yaml

  tasks:
    - name: Create Kueue manifest directory on control1
      ansible.builtin.file:
        path: "{{ manifest_dest_dir }}"
        state: directory
        mode: "0755"

    - name: Copy Kueue manifests to control1
      ansible.builtin.copy:
        src: "{{ manifest_src_dir }}/{{ item }}"
        dest: "{{ manifest_dest_dir }}/{{ item }}"
        mode: "0644"
      loop: "{{ kueue_manifests }}"

    - name: Apply Kueue manifests
      kubernetes.core.k8s:
        state: present
        src: "{{ manifest_dest_dir }}/{{ item }}"
      loop: "{{ kueue_manifests }}"
