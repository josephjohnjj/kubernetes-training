---
- name: Deploy Fluent Bit using Helm
  hosts: control1
  become: true

  collections:
    - kubernetes.core

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  vars:
    values_src_file: "./fluentbit_values.yaml"
    values_dest_file: "/tmp/fluentbit_values.yaml"

    fluentbit_namespace: "fluentbit"
    fluentbit_release: "fluent-bit"
    fluentbit_chart: "fluent/fluent-bit"

  tasks:
    - name: Add Fluent Helm repository
      kubernetes.core.helm_repository:
        name: fluent
        repo_url: https://fluent.github.io/helm-charts

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: helm repo update

    - name: Create Fluent Bit namespace
      kubernetes.core.k8s:
        name: "{{ fluentbit_namespace }}"
        api_version: v1
        kind: Namespace
        state: present

    - name: Copy Fluent Bit values file to control1
      ansible.builtin.copy:
        src: "{{ values_src_file }}"
        dest: "{{ values_dest_file }}"
        mode: "0644"

    - name: Install or upgrade Fluent Bit
      kubernetes.core.helm:
        name: "{{ fluentbit_release }}"
        chart_ref: "{{ fluentbit_chart }}"
        release_namespace: "{{ fluentbit_namespace }}"
        values_files:
          - "{{ values_dest_file }}"
        state: present
        wait: true
        wait_timeout: 300s
