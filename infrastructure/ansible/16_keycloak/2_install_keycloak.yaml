---
- name: Install Keycloak using Bitnami Helm chart
  hosts: control1
  become: true

  collections:
    - kubernetes.core

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  vars:
    keycloak_namespace: keycloak
    values_src: "./keycloak-values.yaml"
    values_dest: "/tmp/keycloak-values.yaml"

  tasks:
    - name: Copy Keycloak Helm values file to control1
      ansible.builtin.copy:
        src: "{{ values_src }}"
        dest: "{{ values_dest }}"
        mode: "0644"

    - name: Set keycloak-sc as default storage class temporarily
      kubernetes.core.k8s:
        state: patched
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: keycloak-sc
        definition:
          metadata:
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"

    - name: Add Bitnami Helm repository
      kubernetes.core.helm_repository:
        name: bitnami
        repo_url: https://charts.bitnami.com/bitnami

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: helm repo update

    - name: Create Keycloak namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ keycloak_namespace }}"

    - name: Install Keycloak using Bitnami Helm chart
      kubernetes.core.helm:
        name: keycloak
        chart_ref: bitnami/keycloak
        release_namespace: "{{ keycloak_namespace }}"
        values_files:
          - "{{ values_dest }}"
        create_namespace: false
        state: present
        wait: true

    - name: Remove default annotation from keycloak-sc
      kubernetes.core.k8s:
        state: patched
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: keycloak-sc
        definition:
          metadata:
            annotations:
              storageclass.kubernetes.io/is-default-class: "false"
