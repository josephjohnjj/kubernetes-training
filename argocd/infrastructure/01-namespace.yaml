kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    # The ingress controller binds directly to ports on the dedicated ingress
    # node, which requires host networking and host ports.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
