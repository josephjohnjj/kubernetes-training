kind: Namespace
metadata:
  name: rook-ceph
  labels:
    # Rook/Ceph daemons and CSI node plugins require privileged containers,
    # host namespaces, and hostPath access to disks and daemon state.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
---
