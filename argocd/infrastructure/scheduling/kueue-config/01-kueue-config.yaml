apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kueue-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: infrastructure

  source:
    repoURL: https://github.com/josephjohnjj/kubernetes-training.git
    path: kueue
    targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: kueue-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
