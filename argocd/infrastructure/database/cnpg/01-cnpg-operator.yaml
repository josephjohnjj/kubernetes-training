apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: infrastructure

  source:
    repoURL: https://github.com/josephjohnjj/kubernetes-training.git
    targetRevision: talos
    path: charts/cloudnative-pg
    helm:
      releaseName: cnpg

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  syncPolicy:
    automated:
      prune: false
      selfHeal: false

    syncOptions:
      - CreateNamespace=true
      # CNPG CRDs such as Cluster and Pooler exceed the client-side apply
      # annotation size limit. Server-side apply avoids storing the complete
      # CRD manifest in kubectl.kubernetes.io/last-applied-configuration.
      - ServerSideApply=true
      # These CRDs have never been managed successfully with client-side
      # apply, so there is no field ownership to migrate. Attempting the
      # migration would hit the same oversized annotation limit first.
      - DisableClientSideApplyMigration=true
