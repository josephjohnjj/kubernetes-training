apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gen3
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"

spec:
  project: infrastructure

  source:
    repoURL: https://github.com/josephjohnjj/kubernetes-training.git
    targetRevision: talos
    # Vendored official gen3-0.2.21 chart, aligned with 2025.08 images.
    path: charts/gen3-2025.08

    helm:
      releaseName: gen3
      valueFiles:
        - values/gen3-values.yaml
        - values.d/00-etl-mapping.yaml
        - values.d/01-usersync.yaml
        - values.d/02-portal-gitops-css.yaml
        - values.d/03-portal-gitops-json.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: gen3

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
