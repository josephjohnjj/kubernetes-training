apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gen3
  namespace: argocd

spec:
  project: infrastructure

  source:
    repoURL: https://github.com/josephjohnjj/kubernetes-training.git
    targetRevision: HEAD
    # Vendored official gen3-0.2.21 chart, aligned with 2025.08 images.
    path: charts/gen3-2025.08

    helm:
      releaseName: gen3
      valueFiles:
        - values/gen3-values.yaml
        - values.d/00-etl-mapping.yaml
        - values.d/01-usersync.yaml
        - values.d/02-portal-gitops-css.yaml
        - values.d/03-portal-gitops-json.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: gen3

  syncPolicy:
    # Keep Gen3 synchronization manual. Several bootstrap Jobs have immutable
    # pod templates and must not be patched by an unattended full sync.
    syncOptions:
      - CreateNamespace=true
