config:
  outputs: |
    [OUTPUT]
        Name opensearch
        Match kube.*

        Host opensearch-cluster-master.opensearch.svc.cluster.local
        Port 9200

        Logstash_Format On
        Logstash_Prefix fluent-bit
        Logstash_DateFormat %Y.%m.%d
        Time_Key @timestamp

        HTTP_User admin
        HTTP_Passwd Opensearch@123

        TLS On
        TLS.Verify Off

        Suppress_Type_Name On
        Retry_Limit False

serviceMonitor:
  enabled: true
  selector:
    release: prometheus

dashboards:
  enabled: true
  namespace: prometheus
