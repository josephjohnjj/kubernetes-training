          name: users-bucket
          key: AWS_ACCESS_KEY_ID

    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: users-bucket
          key: AWS_SECRET_ACCESS_KEY

    - name: AWS_ENDPOINT_URL
      value: "http://rook-ceph-rgw-gen3-store.rook-ceph.svc:80"

    - name: PGHOST
      valueFrom:
        secretKeyRef:
          name: fence-dbcreds
          key: host

    - name: PGUSER
      valueFrom:
        secretKeyRef:
          name: fence-dbcreds
          key: username

    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: fence-dbcreds
          key: password

    - name: PGDB
      valueFrom:
        secretKeyRef:
          name: fence-dbcreds
          key: database

    - name: DB
      #value: "postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/$(PGDB)"
      value: "postgresql://fence_gen3:fence_gen3@gen3-db-cluster-rw.gen3-db:5432/fence_gen3"

    - name: FENCE_DB
      #value: "postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/$(PGDB)"
      value: "postgresql://fence_gen3:fence_gen3@gen3-db-cluster-rw.gen3-db:5432/fence_gen3"

  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
