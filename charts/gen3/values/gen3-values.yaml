  imageTag: "7.10.2"
  clusterName: gen3-elasticsearch
  maxUnavailable: 0
  singleNode: true
  replicas: 1

  clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

  esConfig:
    elasticsearch.yml: |

  volumeClaimTemplate:
    accessModes:
      - ReadWriteOnce
    storageClassName: gen3-elasticsearch-sc
    resources:
      requests:
        storage: 30Gi

  resources:
    requests:
      cpu: "500m"
