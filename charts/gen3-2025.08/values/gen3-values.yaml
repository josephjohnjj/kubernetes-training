# Environment-specific configuration for the Gen3 2025.08 release train.
# Component images are deliberately pinned together; do not use master/latest.
#
# DEPLOYMENT CHECKLIST — update these values for every new environment:
# 1. Replace every occurrence of gen3.44.203.188.20.nip.io and
#    keycloak.44.203.188.20.nip.io with the new public DNS names.
# 2. Use the browser-facing HTTPS URL for Fence callbacks and Keycloak client
#    redirect URIs. Server-side discovery may use HTTP when Keycloak's public
#    HTTPS endpoint has a certificate that Fence does not trust.
# 3. Replace the PostgreSQL host, database users, and passwords. The database
#    service must resolve from the gen3 namespace before the first sync.
# 4. Replace Keycloak realm/client details and client_secret. Configure the
#    exact Fence redirect URL as a valid URI on the Keycloak client.
# 5. Replace Ceph/S3 and Elasticsearch endpoints and credentials. Never commit
#    production secrets here; supply them through a secret-management system.
# 6. Review portal and ETL resource requests/limits for the target nodes.
# 7. Decide whether usersync uses the embedded USER_YAML (path "none") or an
#    S3 users.yaml, and provide credentials that own/can read that object.

global:
  # UPDATE: select the dictionary version required by this deployment.
  dictionaryUrl: "https://s3.amazonaws.com/dictionary-artifacts/datadictionary/develop/schema.json"
  # UPDATE: public Gen3 hostname (host only; do not include the URL scheme).
  hostname: gen3.44.203.188.20.nip.io
  dev: false
  tierAccessLevel: libre
  postgres:
    dbCreate: true
    # UPDATE: secret containing the PostgreSQL administrator connection data.
    externalSecret: postgres-dbcreds
    master:
      # UPDATE: writable PostgreSQL service reachable from the gen3 namespace.
      host: gen3-db-cluster-rw.gen3-db
      database: gen3db
      port: "5432"

ambassador:
  enabled: false

arborist:
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent
  postgres:
    username: arborist_gen3
    password: arborist_gen3

audit:
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent
  postgres:
    username: audit_gen3
    password: audit_gen3
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: ""
    name: audit-service-sa

fence:
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent
  postgres:
    host: gen3-db-cluster-rw.gen3-db
    port: "5432"
    database: fence_gen3
    username: fence_gen3
    password: fence_gen3
  usersync:
    # Ceph/S3-backed users.yaml configuration, retained for future use:
    # userYamlS3AccessKeyId: "MOZX23BEC0RAAD35MBJ7"
    # userYamlS3SecretAccessKey: "SeDmbojoOCywDvncu87YqJjGNAPxcOoguNIBzMC7"
    # userYamlS3Endpoint: "http://rook-ceph-rgw-gen3-store.rook-ceph.svc:80"
    # userYamlS3Path: "s3://users-bucket/users.yaml"
    # Use the USER_YAML embedded in the Fence chart for this POC.
    # UPDATE: use "none" for embedded data or an s3:// URL for managed users.
    userYamlS3Path: "none"
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: ""
    name: fence-service-sa
  indexd:
    url: "http://indexd-service"
    basic_auth: false
    defaultPrefix: "gen31k/"
  extraEnv: &fenceEnv
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: users-bucket
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: users-bucket
          key: AWS_SECRET_ACCESS_KEY
    - name: AWS_ENDPOINT_URL
      # UPDATE: S3-compatible endpoint used by Fence in the target cluster.
      value: "http://rook-ceph-rgw-gen3-store.rook-ceph.svc:80"
    - name: DB
      value: "postgresql://fence_gen3:fence_gen3@gen3-db-cluster-rw.gen3-db:5432/fence_gen3"
    - name: FENCE_DB
      value: "postgresql://fence_gen3:fence_gen3@gen3-db-cluster-rw.gen3-db:5432/fence_gen3"
  env: *fenceEnv
  FENCE_CONFIG:
    OPENID_CONNECT:
      generic_oidc_idp:
        name: Keycloak
        # UPDATE: server-side realm discovery URL; HTTP avoids the POC's
        # untrusted certificate while browser-facing Gen3 remains HTTPS.
        discovery_url: "http://keycloak.44.203.188.20.nip.io/realms/genome/.well-known/openid-configuration"
        # UPDATE: exact public callback registered in the Keycloak gen3-fence
        # client. The /user prefix makes revproxy route it to Fence.
        redirect_url: "https://gen3.44.203.188.20.nip.io/user/login/generic_oidc_idp/login"
        client_id: gen3-fence
        # UPDATE: load the production client secret from secret management.
        client_secret: "10FeHUHWPu8G2xFE1pTcQ5B8hTbBcmfT"
        user_id_field: email
        scope: "openid email"
    LOGIN_OPTIONS:
      - name: Keycloak Login
        description: Gen3 Keycloak Login
        idp: generic_oidc_idp
    DEFAULT_LOGIN_IDP: generic_oidc_idp

guppy:
  enabled: true
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent
  # UPDATE: Elasticsearch endpoint/credentials and the deployment's indices.
  esEndpoint: "http://elastic:41RTyGJQEi63tmab18jCiJLE@elasticsearch-es-http.elasticsearch.svc:9200"
  indices:
    - index: dev_case
      type: case
  configIndex: dev_case-array-config
  authFilterField: auth_resource_path
  enableEncryptWhitelist: false
  encryptWhitelist: ""

# Guppy exits if its configured indices do not exist. This PreSync hook creates
# empty indices once; Tube can then replace/populate them after data is loaded.
elasticsearchBootstrap:
  enabled: true
  # UPDATE: endpoint and bootstrap credentials for the target Elasticsearch.
  endpoint: "http://elasticsearch-es-http.elasticsearch.svc:9200"
  username: elastic
  password: "41RTyGJQEi63tmab18jCiJLE"
  index: dev_case
  configIndex: dev_case-array-config

hatchery:
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent

indexd:
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent
  postgres:
    host: gen3-db-cluster-rw.gen3-db.svc.cluster.local
    port: "5432"
    database: indexd_gen3
    username: indexd_gen3
    password: indexd_gen3
  # Indexd 2025.08 runs from /indexd; the WSGI bootstrap imports settings here.
  volumeMounts:
    - name: uwsgi-config
      mountPath: /etc/uwsgi/uwsgi.ini
      subPath: uwsgi.ini
    - name: config-volume
      readOnly: true
      mountPath: /indexd/local_settings.py
      subPath: local_settings.py
    - name: gunicorn-conf
      readOnly: true
      mountPath: /indexd/deployment/wsgi/gunicorn.conf.py
      subPath: gunicorn.conf.py

manifestservice:
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent

metadata:
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent
  postgres:
    username: metadata_gen3
    password: metadata_gen3

peregrine:
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent
  postgres:
    username: peregrine_gen3
    password: peregrine_gen3

portal:
  enabled: true
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent
  annotations:
    secret.reloader.stakater.com/reload: portal-config
  resources:
    # UPDATE: size these for the portal build; it can exceed small memory limits.
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 8Gi

revproxy:
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent
  # UPDATE: public Gen3 hostname; keep this aligned with global.hostname.
  hostname: gen3.44.203.188.20.nip.io
  ingress:
    enabled: true
    # UPDATE: IngressClass installed in the target cluster.
    className: nginx
    hosts:
      # UPDATE: public Gen3 hostname routed to revproxy-service.
      - host: gen3.44.203.188.20.nip.io
        paths:
          - path: /
            pathType: Prefix
    # UPDATE: add the public hostname and TLS Secret for HTTPS deployments.
    tls: []
  service:
    type: ClusterIP

sheepdog:
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent
  postgres:
    username: gen3db
    password: gen3db-password

wts:
  image:
    tag: "2025.08"
    pullPolicy: IfNotPresent
  postgres:
    username: wts_gen3
    password: wts_gen3

etl:
  enabled: true
  image:
    tube:
      tag: "2025.08"
      pullPolicy: IfNotPresent
    spark:
      tag: "2025.08"
      pullPolicy: IfNotPresent
  # UPDATE: Elasticsearch connection details used by Tube/Spark.
  esEndpoint: elasticsearch-es-http.elasticsearch.svc
  esPort: "9200"
  esUseSsl: false
  esUser: elastic
  esPassword: "41RTyGJQEi63tmab18jCiJLE"
  resources:
    tube:
      requests:
        cpu: 300m
        memory: 128Mi
    spark:
      requests:
        cpu: 300m
        memory: 128Mi
