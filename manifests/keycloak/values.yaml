externalDatabase:
  host: cnpg-cluster-rw.cnpg-database.svc.cluster.local
  port: 5432
  user: keycloak
  database: keycloak
  password: keycloak-pwd

postgresql:
  enabled: false

image:
  registry: docker.io
  #repository: bitnami/keycloak
  repository: bitnamilegacy/keycloak
  tag: 26.3.3-debian-12-r0

# TLS terminates at ingress-nginx. Trust its forwarded headers, keep HTTP on
# the in-cluster hop, and publish a stable HTTPS issuer for OIDC clients.
production: true
proxyHeaders: xforwarded
httpEnabled: true

extraEnvVars:
  - name: KC_HOSTNAME
    value: "https://keycloak.44.203.188.20.nip.io"
